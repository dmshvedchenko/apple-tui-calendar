[package]
name = "tui-calendar"
version = "1.0.2"
edition = "2024"
description = "A keyboard-first macOS Calendar client for the terminal"
license = "MIT"
repository = "https://github.com/dmshvedchenko/apple-tui-calendar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
futures-util = "0.3"
iana-time-zone = "0.1"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
